name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.9" }
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: macos-latest,   python: "3.11" }
          - { os: windows-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Import gate (no third-party imports)
        run: python ci/import_gate.py
      - name: Suites and count floors
        run: python ci/check_counts.py

  gate:
    name: gate (mutation + fail-proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove the suites can fail
        run: python ci/prove_suites_can_fail.py
      - name: Mutation sweep
        run: python ci/mutation.py
